name: CI Pipeline (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para hacer el commit en el README
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Actualizar README.md con la feature
        run: |
          RAMA="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $RAMA" >> README.md
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # El [skip ci] evita que este commit automático vuelva a disparar el workflow en bucle infinito
          git commit -m "docs: Añadida feature $RAMA [skip ci]" || echo "No hay cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV Token
        shell: powershell
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
              Write-Host "Coinciden los DEV Tokens"
          } else {
              Write-Host "No coinciden X"
              exit 1
          }